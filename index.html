<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>蜂巢·隱曜 | VLink</title>
    <style>
        /* 全局重置与变量 */
        :root {
            --bg-color: #f7f9fc; /* 浅灰背景，保护视力且现代 */
            --card-bg: #ffffff;
            --text-primary: #2c3e50;
            --text-secondary: #95a5a6;
            --accent-color: #000000;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 8px 16px rgba(0, 0, 0, 0.08);
            --radius-card: 16px;
            --radius-icon: 12px;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        /* 容器限制，模拟手机视图 */
        .container {
            width: 100%;
            max-width: 480px;
            position: relative;
        }

        /* --- 头部个人信息区 --- */
        .header {
            text-align: center;
            margin-bottom: 32px;
            animation: fadeInDown 0.8s ease-out;
        }

        .avatar-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 16px;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--card-bg);
            box-shadow: var(--shadow-sm);
        }

        .username {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .bio {
            font-size: 14px;
            color: var(--text-secondary);
            padding: 0 20px;
            font-weight: 400;
        }

        /* --- 链接列表区 --- */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* 小标题样式 (Section Header) */
        .section-header {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 20px 0 5px 10px;
            opacity: 0.8;
        }

        /* 链接卡片样式 */
        .link-card {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            padding: 12px;
            border-radius: var(--radius-card);
            text-decoration: none;
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            border: 1px solid rgba(255, 255, 255, 0.5);
            position: relative;
            overflow: hidden;
        }

        /* 鼠标悬停/点击效果 */
        .link-card:hover, .link-card:active {
            transform: translateY(-3px) scale(1.01);
            box-shadow: var(--shadow-hover);
        }

        .link-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-icon);
            object-fit: cover;
            margin-right: 16px;
            flex-shrink: 0;
            background-color: #f0f0f0; /* 图片加载前的占位色 */
        }

        .link-text {
            font-size: 15px;
            font-weight: 500;
            flex-grow: 1;
            padding-right: 10px;
            /* 文本溢出处理 */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 尾部 */
        .footer {
            margin-top: 50px;
            text-align: center;
            font-size: 12px;
            color: #bdc3c7;
        }

        .footer a {
            color: inherit;
            text-decoration: none;
            font-weight: 600;
        }

        /* 简单动画 */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 针对深色模式的微调 (可选) */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --card-bg: #1e1e1e;
                --text-primary: #e0e0e0;
                --text-secondary: #a0a0a0;
                --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            }
            .link-card { border: 1px solid #333; }
        }
    </style>
</head>
