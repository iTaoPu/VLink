<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ifanr | Holographic Fragment</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f2fe;
            --neon-purple: #7000ff;
            --bg-black: #020205;
            --scan-line: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-black);
            color: #fff;
            font-family: 'Orbitron', 'PingFang SC', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        /* 扫描线背景特效 */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(to bottom, transparent 50%, var(--scan-line) 50%);
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
        }

        .ambient-light {
            position: fixed;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 50%, rgba(112, 0, 255, 0.1) 0%, transparent 70%);
            z-index: -1;
        }

        .fragment-container {
            width: 100%;
            max-width: 440px;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
        }

        /* 头部：全息头像 */
        .profile {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 60px;
            padding-left: 10px;
        }

        .avatar-frame {
            position: relative;
            width: 70px; height: 70px;
        }

        .avatar-frame img {
            width: 100%; height: 100%;
            border-radius: 4px; /* 硬核方角 */
            object-fit: cover;
            border: 1px solid var(--neon-cyan);
            filter: contrast(1.2) brightness(1.1);
        }

        .avatar-frame::before {
            content: "";
            position: absolute;
            inset: -5px;
            border: 1px solid var(--neon-purple);
            clip-path: polygon(0 0, 30% 0, 0 30%);
        }

        .brand-info h1 { font-size: 22px; letter-spacing: 2px; text-transform: uppercase; }
        .brand-info p { font-size: 12px; color: var(--neon-cyan); opacity: 0.7; }

        /* 非对称碎片链接 */
        .link-grid {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .fragment-item {
            position: relative;
            width: 85%;
            height: 70px;
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid var(--neon-cyan);
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #fff;
            transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            clip-path: polygon(0 0, 100% 0, 95% 100%, 0 100%);
        }

        /* 奇数行向右偏置 */
        .fragment-item:nth-child(even) {
            align-self: flex-end;
            border-left: none;
            border-right: 3px solid var(--neon-purple);
            clip-path: polygon(5% 0, 100% 0, 100% 100%, 0 100%);
            text-align: right;
            justify-content: flex-end;
        }

        .fragment-item:hover {
            background: rgba(255, 255, 255, 0.08);
            width: 90%;
            border-color: #fff;
        }

        .frag-icon {
            width: 40px; height: 40px;
            border-radius: 50%;
            margin: 0 15px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .frag-text {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            padding: 0 10px;
        }

        /* 底部社交：矩阵排版 */
        .social-matrix {
            margin-top: 80px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            border: 1px solid var(--border-glass);
            background: rgba(255,255,255,0.02);
        }

        .matrix-btn {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.4);
            font-size: 20px;
            border-right: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }

        .matrix-btn:hover {
            background: var(--neon-cyan);
            color: #000;
        }

        .glitch-footer {
            margin-top: 40px;
            text-align: center;
            font-size: 9px;
            color: #444;
            letter-spacing: 10px;
        }
    </style>
</head>
<body>

<div class="ambient-light"></div>

<div class="fragment-container">
    <header class="profile">
        <div class="avatar-frame">
            <img src="https://m.ifanr.com/favicon.ico" alt="ifanr">
        </div>
        <div class="brand-info">
            <h1>IFANR.TECH</h1>
            <p>SYSTEM ACCESS GRANTED</p>
        </div>
    </header>

    <div class="link-grid">
        <a href="#" class="fragment-item">
            <img src="https://m.ifanr.com/favicon.ico" class="frag-icon">
            <span class="frag-text">进入官网 MAIN_NET</span>
        </a>

        <a href="#" class="fragment-item">
            <span class="frag-text">数字生活 LIFE_STYLE</span>
            <img src="https://m.ifanr.com/favicon.ico" class="frag-icon">
        </a>

        <a href="#" class="fragment-item">
            <img src="https://m.ifanr.com/favicon.ico" class="frag-icon">
            <span class="frag-text">应用方案 APP_SOLUTION</span>
        </a>

        <a href="#" class="fragment-item">
            <span class="frag-text">玩物特惠 COOL_STUFF</span>
            <img src="https://m.ifanr.com/favicon.ico" class="frag-icon">
        </a>
    </div>

    <footer class="social-matrix">
        <a href="#" class="matrix-btn"><i class="ri-wechat-fill"></i></a>
        <a href="#" class="matrix-btn"><i class="ri-mail-line"></i></a>
        <a href="#" class="matrix-btn"><i class="ri-douyin-fill"></i></a>
        <a href="#" class="matrix-btn"><i class="ri-qq-fill"></i></a>
        <a href="#" class="matrix-btn"><i class="ri-telegram-fill"></i></a>
    </footer>

    <div class="glitch-footer">HOLOGRAPHIC_CORE_V3</div>
</div>

</body>
</html>
