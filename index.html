    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-sub: #666666;
            --btn-bg: #ffffff;
            --btn-hover: #f0f0f0;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            --radius: 12px;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Profile Section */
        .profile {
            text-align: center;
            margin-bottom: 30px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: var(--shadow);
            margin-bottom: 15px;
            border: 3px solid #fff;
        }

        .username {
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 10px 0;
        }

        .bio {
            font-size: 14px;
            color: var(--text-sub);
            margin: 0;
            line-height: 1.5;
            padding: 0 10px;
        }

        /* Links Section */
        .links {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-item {
            background-color: var(--btn-bg);
            border-radius: var(--radius);
            padding: 15px;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            align-items: center;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: var(--shadow);
            border: 1px solid rgba(0,0,0,0.02);
        }

        .link-item:hover {
            transform: translateY(-2px);
            background-color: var(--btn-hover);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        .link-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            margin-right: 15px;
            object-fit: cover;
        }

        .link-text {
            font-weight: 500;
            font-size: 15px;
            flex-grow: 1;
        }

        /* Section Header */
        .section-header {
            margin-top: 15px;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 1px;
            align-self: flex-start;
            padding-left: 5px;
        }

        /* Footer */
        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #999;
            text-align: center;
        }

        .footer a {
            color: #999;
            text-decoration: none;
        }
    </style>
</head>
